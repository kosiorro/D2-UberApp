<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kreator postaci</title>
<style>
:root{
  --bg:#080d09; --panel:#0e160f; --line:#36422d; --line2:#4a573d;
  --gold:#d7ad55; --gold2:#f0ce79; --text:#e8eadf; --muted:#9da992;
  --cyan:#41c8ff; --green:#45db83; --skip:#b6934b;
}
*{box-sizing:border-box}
html,body{margin:0;background:#070b08;color:var(--text);font-family:Segoe UI,Tahoma,Arial,sans-serif}
body{
  background:
    radial-gradient(circle at 50% -15%,rgba(116,132,69,.15),transparent 38%),
    linear-gradient(#090e0a,#060906);
}
.window{
  width:min(720px,100vw);margin:0 auto;background:#0a100b;
  border-left:1px solid #252e22;border-right:1px solid #252e22;box-shadow:0 0 32px #0009
}
.wizardHead{margin:0;padding:12px 16px 10px;border-bottom:1px solid #273123;background:linear-gradient(#111811,#0b110c)}
.eyebrow{font-size:9px;letter-spacing:1.6px;text-transform:uppercase;color:#ac9250;font-weight:800}
#wizardTitle{margin:4px 0 10px;font:600 21px Georgia,serif;color:#f0d07a}
.mainProgress{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.phase{
  position:relative;min-height:54px;padding:8px 6px 8px 34px;border:1px solid #34412c;border-radius:4px;
  background:#111811;color:#8f9a86
}
.phase .num{
  position:absolute;left:7px;top:10px;width:19px;height:19px;border-radius:50%;display:grid;place-items:center;
  border:1px solid #536043;font-size:9px;font-weight:800
}
.phase b{display:block;font-size:10px;color:#c9d1c1}.phase small{font-size:8px;color:#7e8b76}
.phase.active{background:#0d2c3c;border-color:#4bc7fb}.phase.active .num{border-color:#4bc7fb;color:white}
.phase.active b{color:white}.phase.done{border-color:#376544}.phase.done .num{background:#1d5d36;border-color:#47a968;color:#d9ffe8}
.content{padding:14px 16px 94px}
.card{border:1px solid var(--line);border-radius:5px;background:linear-gradient(#101811,#0c130e);padding:14px}
.cardTop{display:flex;gap:12px}.cardIcon{
  width:44px;height:44px;flex:0 0 44px;display:grid;place-items:center;border:1px solid #5b6844;border-radius:4px;
  background:#151e15;color:#e5c565;font-size:18px;font-weight:800
}
.cardTitle{flex:1}.cardTitle .kicker{font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:#a88d49;font-weight:800}
.cardTitle h2{margin:3px 0;font:600 21px Georgia,serif;color:#efd078}.cardTitle p{margin:0;color:#a7b29d;font-size:12px;line-height:1.48}
.instruction{margin-top:13px;padding:11px 12px;border:1px solid #394630;border-radius:4px;background:#09100b}
.instruction strong{display:block;margin-bottom:5px;font-size:12px}.instruction p{margin:0;color:#a5b09a;font-size:11px;line-height:1.5}
.keyrow{
  margin-top:10px;padding:10px 12px;display:flex;align-items:center;gap:11px;border:1px solid #5d4d2a;border-radius:4px;
  background:linear-gradient(#382c17,#21190e)
}
.key{min-width:56px;height:42px;padding:0 10px;display:grid;place-items:center;border:1px solid #d09b36;border-radius:4px;
  background:linear-gradient(#7b5d24,#4a3414);color:#fff0b5;font-weight:800;font-size:16px}
.keytext b{display:block;color:#f0d17c;font-size:11px}.keytext small{display:block;color:#b6ae90;margin-top:2px;line-height:1.35}
.listen{display:flex;align-items:center;gap:8px;margin-top:10px;padding:9px 10px;border:1px dashed #4b5942;border-radius:4px;background:#101610}
.listen .dot{width:10px;height:10px;border-radius:50%;background:var(--green);box-shadow:0 0 9px #44db83aa}
.listen b{font-size:10px;color:#dce7d6}.listen span{margin-left:auto;color:#88977f;font-size:9px}
.tip{margin-top:10px;padding:8px 10px;border-left:3px solid #94763b;background:#17140d;color:#b7ae91;font-size:9px;line-height:1.45}

/* ---------- CHARACTER EQUIPMENT ---------- */
.eqWrap{margin-top:14px;display:grid;grid-template-columns:minmax(360px,1.12fr) .88fr;gap:12px}
.eqBoard{
  position:relative;height:282px;border:1px solid #5a5d53;border-radius:4px;overflow:hidden;
  background:
    radial-gradient(circle at 50% 40%,rgba(96,99,91,.22),transparent 31%),
    repeating-linear-gradient(45deg,rgba(255,255,255,.015) 0 2px,transparent 2px 5px),
    linear-gradient(#353733,#1d201e 55%,#262926);
  box-shadow:inset 0 0 26px #000b
}
.eqBoard:before{content:"";position:absolute;inset:8px;border:1px solid #111613;box-shadow:inset 0 0 0 2px #585a53}
.centerSigil{
  position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);width:70px;height:104px;border-radius:42% 42% 35% 35%;
  border:1px solid #4c4f49;background:
    linear-gradient(90deg,transparent 47%,#67685f 48% 52%,transparent 53%),
    radial-gradient(circle at 50% 20%,#5d6058 0 12px,transparent 13px),
    linear-gradient(#444741,#252825);opacity:.55
}
.setBadge{position:absolute;left:15px;top:14px;z-index:4;display:flex;gap:4px}
.setBadge span{width:25px;height:22px;display:grid;place-items:center;border:1px solid #70623e;background:#201d14;color:#c5a75a;font-size:10px;font-weight:800}
.setBadge span.on{border-color:#45c8ff;background:#0b4964;color:white}
.eSlot{
  position:absolute;z-index:3;border:1px solid #141817;background:linear-gradient(#131817,#070a09);
  box-shadow:inset 0 0 0 2px #51534d,inset 0 0 14px #000c;border-radius:2px;
  display:grid;place-items:center;color:#666b65;transition:.15s
}
.eSlot:after{content:attr(data-name);position:absolute;left:50%;bottom:3px;transform:translateX(-50%);color:#747c72;font-size:8px;white-space:nowrap;text-shadow:0 1px #000}
.eSlot.active{border-color:#45caff;box-shadow:inset 0 0 0 2px #276a85,inset 0 0 18px #0c6b95aa,0 0 14px #35c2ff88;background:linear-gradient(#10374a,#07161d)}
.eSlot.active:after{color:#dff6ff}.eSlot.done{box-shadow:inset 0 0 0 2px #426649,inset 0 0 13px #183f27}
.eSlot.skipped{box-shadow:inset 0 0 0 2px #7a6639,inset 0 0 13px #5a451c}.itemGlyph{font-size:23px;filter:drop-shadow(0 1px #000)}
/* tighter D2-like spacing: bottom items sit directly under the torso */
.weapon{left:22px;top:48px;width:72px;height:148px}
.shield{right:22px;top:48px;width:72px;height:148px}
.helm{left:50%;top:18px;transform:translateX(-50%);width:64px;height:58px}
.amulet{left:calc(50% + 40px);top:81px;width:40px;height:48px}
.armor{left:50%;top:80px;transform:translateX(-50%);width:80px;height:104px}
.gloves{left:25px;top:202px;width:74px;height:58px}
.ring1{left:calc(50% - 77px);top:205px;width:47px;height:47px}
.belt{left:50%;top:211px;transform:translateX(-50%);width:70px;height:35px}
.ring2{left:calc(50% + 30px);top:205px;width:47px;height:47px}
.boots{right:25px;top:202px;width:74px;height:58px}
.swapNote{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:6;width:205px;padding:12px;border:1px solid #bf913a;border-radius:4px;background:#21170df2;text-align:center;color:#e9ce78;box-shadow:0 0 24px #000c}
.swapNote .w{font-size:28px;font-weight:900;margin-bottom:4px}.swapNote small{display:block;color:#b9aa80;line-height:1.35}
.sidePanel{border:1px solid #34412c;border-radius:4px;background:#0b120d;padding:9px}
.sidePanel h3{margin:0 0 7px;font-size:9px;letter-spacing:1.3px;color:#cab15f;text-transform:uppercase}
.scanList{display:grid;gap:5px}.scanItem{min-height:31px;padding:5px 7px;border:1px solid #303b2a;border-radius:3px;background:#101710;display:flex;align-items:center;gap:7px;color:#89947f;font-size:9px}
.scanItem .mini{width:18px;height:18px;display:grid;place-items:center;border:1px solid #44513a;border-radius:2px;font-size:9px}
.scanItem.active{border-color:#41c8ff;background:#0d3244;color:white}.scanItem.done{border-color:#395b40;color:#91b59a}.scanItem.skipped{border-color:#6f5c31;color:#baa46b}
.statusPill{margin-left:auto;font-size:8px}

/* ---------- INVENTORY ---------- */
.invWrap{display:grid;grid-template-columns:minmax(360px,1fr) .8fr;gap:12px;margin-top:14px}
.inventoryFrame{
  position:relative;padding:14px;border:1px solid #5b5e54;border-radius:4px;background:
  radial-gradient(circle at 50% 30%,rgba(110,91,53,.11),transparent 45%),
  linear-gradient(#2b2d29,#171a18);box-shadow:inset 0 0 20px #0009
}
.inventoryTitle{text-align:center;margin-bottom:9px;color:#c8ae67;font:600 12px Georgia,serif}
.inventoryGrid{
  display:grid;grid-template-columns:repeat(10,1fr);grid-template-rows:repeat(4,36px);
  gap:2px;padding:4px;border:2px ridge #52564d;background:#090c0a
}
.invCell{border:1px solid #242b25;background:#101511}
.invItem{
  position:absolute;z-index:4;border:1px solid #2b2d29;background:linear-gradient(#151a17,#090b0a);
  box-shadow:inset 0 0 0 2px #565a51,inset 0 0 12px #000;border-radius:2px;display:grid;place-items:center;
  color:#bbaa67;font-size:16px
}
.invItem.active{border-color:#45caff;box-shadow:inset 0 0 0 2px #276a85,inset 0 0 18px #0c6b95aa,0 0 14px #35c2ff88;background:#103548}
.invItem.done{box-shadow:inset 0 0 0 2px #426649,inset 0 0 12px #183f27}.invItem.skipped{box-shadow:inset 0 0 0 2px #7a6639,inset 0 0 12px #5a451c}
.inventoryCanvas{position:relative;height:152px}
.invLegend{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.invLegend span{font-size:8px;color:#8f9a86;border:1px solid #36412f;background:#101610;padding:4px 6px;border-radius:3px}


.inventoryFrame.scanning{
  border-color:#3eaed9;
  box-shadow:inset 0 0 20px #0009,0 0 15px rgba(65,200,255,.10)
}
.invItem.scanned{
  border-color:#4aae6b;
  box-shadow:inset 0 0 0 2px #426649,inset 0 0 14px #183f27,0 0 8px rgba(69,219,131,.18);
  color:#c8e8c9
}
.inventoryScanControls{
  margin-top:10px;padding:10px;border:1px solid #34412c;border-radius:4px;background:#0b120d
}
.scanCounter{
  display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px;
  color:#a6b29c;font-size:10px
}
.scanCounter strong{color:#e6c66f;font-size:12px}
.scanBar{height:5px;border:1px solid #293326;background:#070b08;border-radius:20px;overflow:hidden}
.scanBar > i{display:block;height:100%;background:#329b62;width:0;transition:.18s}
.finishScanBtn{
  width:100%;margin-top:9px;border:1px solid #ca9231;background:linear-gradient(#75541f,#493214);
  color:#ffe8a6;font-weight:800
}
.finishScanBtn:hover{filter:brightness(1.08)}
.inventoryHint{
  margin-top:8px;color:#87957f;font-size:9px;line-height:1.45
}


@keyframes inventoryScanPulse{
  0%,100%{box-shadow:inset 0 0 0 2px #287da0,inset 0 0 15px #0d6d96aa,0 0 8px rgba(65,200,255,.35)}
  50%{box-shadow:inset 0 0 0 2px #42caff,inset 0 0 22px #1495cbaa,0 0 18px rgba(65,200,255,.72)}
}
@keyframes inventoryScanSweep{
  0%{transform:translateY(-120%);opacity:0}
  12%{opacity:.8}
  85%{opacity:.65}
  100%{transform:translateY(430%);opacity:0}
}
.invItem.scanning-now{
  z-index:7;
  border-color:#45caff;
  background:linear-gradient(#12445b,#0a202b);
  color:#e7f9ff;
  animation:inventoryScanPulse .9s ease-in-out infinite;
}
.invItem.scanning-now::after{
  content:"";
  position:absolute;
  left:3px;right:3px;top:4px;
  height:2px;
  background:rgba(169,237,255,.95);
  box-shadow:0 0 7px rgba(65,200,255,.9);
  animation:inventoryScanSweep 1.05s linear infinite;
  pointer-events:none;
}
.inventoryStatusLive{
  display:flex;
  align-items:center;
  gap:8px;
  margin-bottom:9px;
  color:#c6d4c0;
  font-size:10px;
}
.inventoryStatusLive .liveDot{
  width:9px;height:9px;border-radius:50%;
  background:#45db83;
  box-shadow:0 0 9px rgba(69,219,131,.7);
}
.inventoryStatusLive strong{color:#f0d17c}
@media (prefers-reduced-motion: reduce){
  .invItem.scanning-now,
  .invItem.scanning-now::after{animation:none}
}

/* ---------- MERC ---------- */
.mercChoice{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:14px}
.loadoutBtn{
  min-height:74px;border:1px solid #3b4634;background:#111811;color:#aab49e;padding:8px;border-radius:4px;cursor:pointer;text-align:left
}
.loadoutBtn b{display:block;color:#d6bd70;font-size:10px;margin-bottom:4px}.loadoutBtn small{font-size:9px;line-height:1.3}
.loadoutBtn.active{border-color:#42c7ff;background:#0d3142;color:white;box-shadow:inset 0 0 0 1px #1b769a}
.mercBoard{
  position:relative;height:282px;border:1px solid #5a5d53;border-radius:4px;background:
  radial-gradient(circle at 50% 42%,rgba(118,113,96,.22),transparent 35%),
  linear-gradient(#343633,#1a1d1b);box-shadow:inset 0 0 24px #000b
}
.mercSilhouette{
  position:absolute;left:50%;top:49%;transform:translate(-50%,-50%);width:82px;height:165px;border:1px solid #4d514a;
  border-radius:35% 35% 24% 24%;background:
    radial-gradient(circle at 50% 15%,#595d55 0 15px,transparent 16px),
    linear-gradient(90deg,transparent 47%,#64675f 48% 52%,transparent 53%),
    linear-gradient(#424640,#242724);opacity:.58
}
.mSlot{
  position:absolute;z-index:3;border:1px solid #141817;background:linear-gradient(#131817,#070a09);
  box-shadow:inset 0 0 0 2px #51534d,inset 0 0 14px #000c;border-radius:2px;display:grid;place-items:center;color:#6a7068
}
.mSlot:after{content:attr(data-name);position:absolute;left:50%;bottom:3px;transform:translateX(-50%);font-size:8px;color:#778076;white-space:nowrap}
.mSlot.active{border-color:#45caff;box-shadow:inset 0 0 0 2px #276a85,inset 0 0 18px #0c6b95aa,0 0 14px #35c2ff88;background:#103548}
.mSlot.done{box-shadow:inset 0 0 0 2px #426649,inset 0 0 12px #183f27}.mSlot.skipped{box-shadow:inset 0 0 0 2px #7a6639,inset 0 0 12px #5a451c}
.mHelm{left:50%;top:19px;transform:translateX(-50%);width:68px;height:62px}
.mArmor{left:50%;top:91px;transform:translateX(-50%);width:88px;height:115px}
.mLeft{left:27px;top:65px;width:77px;height:147px}.mRight{right:27px;top:65px;width:77px;height:147px}
.mTwoHand{left:25px;right:25px;bottom:18px;height:50px}
.mercLabel{position:absolute;left:50%;bottom:4px;transform:translateX(-50%);color:#a88e50;font-size:8px;letter-spacing:1px}

/* ---------- STATS / SKILLS ---------- */
.statsMock{margin-top:14px;display:grid;grid-template-columns:1fr 1fr;gap:10px;border:1px solid #484d43;background:linear-gradient(#292c29,#171a18);padding:10px;border-radius:4px}
.statCol{display:grid;gap:7px}.stat{height:42px;border:1px solid #161a17;background:#111511;box-shadow:inset 0 0 0 2px #40433e;padding:6px 8px}
.stat span{display:block;font-size:8px;color:#999f94;text-transform:uppercase}.stat b{display:block;margin-top:2px;color:#d6c590;font:600 16px Georgia,serif}
.treeTabs{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:14px}.treeCard{min-height:150px;border:1px solid #3c4634;border-radius:4px;background:radial-gradient(circle at 50% 20%,rgba(91,71,34,.25),transparent 34%),linear-gradient(#18170f,#0e130f);padding:9px}
.treeCard.active{border-color:#41c8ff;background:linear-gradient(#0d3041,#101812);box-shadow:0 0 13px #2cc1ff33}.treeCard h4{margin:0 0 8px;color:#d8ba60;font:600 12px Georgia,serif;text-align:center}
.nodes{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.node{aspect-ratio:1;border:1px solid #55503b;background:#17180f;display:grid;place-items:center;color:#9b8a57;font-size:10px;border-radius:3px}
.treeCard.active .node:nth-child(2),.treeCard.active .node:nth-child(5),.treeCard.active .node:nth-child(8){border-color:#4ac7ff;background:#12384a;color:#dff7ff}
.doneBox{text-align:center;padding:22px 8px}.doneOrb{width:70px;height:70px;margin:0 auto 12px;border-radius:50%;display:grid;place-items:center;border:1px solid #4d8b5b;background:radial-gradient(circle at 50% 35%,#266f4a,#102519 65%);color:#c4ffd5;font-size:32px}
.doneBox h2{margin:0;color:#efd078;font:600 23px Georgia,serif}.doneBox p{margin:8px auto;max-width:440px;color:#a6b09d;font-size:11px;line-height:1.5}

/* footer */
.footer{
  position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(720px,100vw);padding:10px 16px 12px;
  display:grid;grid-template-columns:105px 105px 1fr 125px;gap:7px;align-items:center;background:linear-gradient(#09100bdd,#09100b 40%);
  border-top:1px solid #34402c;backdrop-filter:blur(7px);z-index:50
}
button{height:41px;border-radius:4px;font-size:11px;font-weight:800;cursor:pointer}
.back{border:1px solid #46513b;background:#151c14;color:#bec6b8}.skip{border:1px solid #725f35;background:#211b10;color:#d5b96c}
.next{border:1px solid #c99131;background:linear-gradient(#75541f,#493214);color:#ffe8a6}.back:disabled{opacity:.38;cursor:default}
.counter{text-align:center;color:#899582;font-size:9px}.counter b{color:#d2b866;font-size:10px}.skipInfo{text-align:center;margin-top:4px;color:#b69c5e;font-size:8px}
@media(max-width:640px){
  .eqWrap,.invWrap{grid-template-columns:1fr}.footer{grid-template-columns:86px 86px 1fr 106px}
  .phase{padding-left:28px}.phase .num{left:5px}.phase small{display:none}.mercChoice{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="window">
  <div class="wizardHead">
    <div class="eyebrow">Kreator skanowania postaci</div>
    <h1 id="wizardTitle"></h1>
    <div class="mainProgress">
      <div class="phase" id="phase-stats"><span class="num">1</span><b>Statystyki</b><small>panel C</small></div>
      <div class="phase" id="phase-character"><span class="num">2</span><b>Postać + plecak</b><small>EQ i inventory</small></div>
      <div class="phase" id="phase-merc"><span class="num">3</span><b>Najemnik</b><small>jego wyposażenie</small></div>
      <div class="phase" id="phase-skills"><span class="num">4</span><b>Umiejętności</b><small>3 drzewka</small></div>
    </div>
  </div>

  <main class="content" id="content"></main>

  <div class="footer">
    <button id="backBtn" class="back">← Wstecz</button>
    <button id="skipBtn" class="skip">Pomiń</button>
    <div class="counter" id="counter"></div>
    <button id="nextBtn" class="next">Dalej →</button>
  </div>
</div>

<script src="/static/character-creator.js"></script>
<script src="/static/character-creator-live.js"></script>
</body>
</html>
