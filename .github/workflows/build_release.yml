name: Build and Release D2 UberApp Windows

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Standalone Release with PyInstaller
        run: |
          python build_release.py

      - name: Install Inno Setup
        run: |
          choco install innosetup --no-progress

      - name: Compile Inno Setup Windows Installer (.exe)
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "D2 UberApp ${{ github.ref_name || 'v1.0.0' }}"
          draft: false
          prerelease: false
          files: |
            Output/D2UberApp_Setup_v1.0.0.exe
            D2UberApp_Windows_x64.zip
          body: |
            ## D2 UberApp Windows Release ⚔️

            ### 🇵🇱 Pliki do pobrania:
            - **🎮 Instalator Windows (.exe) [Zalecane dla graczy]**: `D2UberApp_Setup_v1.0.0.exe` &mdash; klasyczny kreator instalacji, tworzy skrót na Pulpicie i w Menu Start, 0% konfiguracji.
            - **📦 Wersja Przenośna Portable (.zip)**: `D2UberApp_Windows_x64.zip` &mdash; wystarczy rozpakować i uruchomić `Launch_D2_UberApp.bat` lub `D2UberApp.exe`. Nie wymaga instalacji.

            ### 🎮 Błyskawiczna Instrukcja Obsługi w Grze:
            1. **Uruchom program**: Odpal aplikację przez skrót na Pulpicie lub `Launch_D2_UberApp.bat`.
            2. **Wskaż przedmiot w D2R**: Najedź kursorem myszy na przedmiot na ziemi lub w ekwipunku, aby wyświetlił się tooltip ze statystykami.
            3. **Wciśnij F10**: Dźwięk potwierdzi zrzut ekranu, a sztuczna inteligencja Gemini 3.5 przeanalizuje parametry i widełki w ~1.2s.
            4. **Widełki i 1-Klik Giełda**: Odznaki `PERFECT (100%)`, `HIGH`, `MID`, `LOW`. Kliknij "Eksportuj do marketu", by od razu wystawić ofertę na giełdzie [d2uberappmarket.tw5.org](https://d2uberappmarket.tw5.org).

            ---

            ### 🇬🇧 Download Options:
            - **🎮 Windows Setup Wizard (.exe) [Recommended]**: `D2UberApp_Setup_v1.0.0.exe` &mdash; 1-click wizard installer, creates Desktop & Start Menu shortcuts.
            - **📦 Portable Bundle (.zip)**: `D2UberApp_Windows_x64.zip` &mdash; fully standalone, simply extract and launch `Launch_D2_UberApp.bat` or `D2UberApp.exe`.

            ### 🎮 In-Game Quick Start Guide:
            1. **Launch App**: Open via Desktop shortcut or `Launch_D2_UberApp.bat`.
            2. **Hover Cursor in D2R**: Hover your mouse over any item tooltip in Sanctuary.
            3. **Press F10**: Audio chime confirms capture. Gemini AI parses affixes and rolls in ~1.2s.
            4. **Check Rolls & Export**: View exact roll ratings (`PERFECT`, `HIGH`, `MID`, `LOW`) and export to the online trading hub with 1 click.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
