name: Build and Release D2 UberApp Windows

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Run tests
        run: |
          python -m unittest discover -s tests -p test_market*.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p test_character_skills.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p test_tooltip_detection.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p test_scan_diagnostics.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p test_app_updater.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p test_api_setup.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p test_release_validation.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p test_character_management.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Read release version
        run: |
          $releaseVersion = python -c "from app_version import VERSION; print(VERSION)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($env:GITHUB_REF -like 'refs/tags/*' -and $env:GITHUB_REF_NAME -ne "v$releaseVersion") { throw 'Tag and app version differ' }
          "APP_VERSION=$releaseVersion" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build Standalone Release with PyInstaller
        run: |
          python build_release.py

      - name: Install Inno Setup
        run: |
          choco install innosetup --no-progress

      - name: Compile Inno Setup Windows Installer (.exe)
        run: |
          $packageDir = (Get-Content build/release-package.txt -Raw).Trim()
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DPackageDir=$packageDir" "/DReleaseVersion=$env:APP_VERSION" installer.iss

      - name: Upload Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: D2UberApp-Windows-${{ env.APP_VERSION }}
          path: |
            Output/D2UberApp_Setup_v${{ env.APP_VERSION }}.exe
            D2UberApp_Windows_x64.zip
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: "D2 UberApp ${{ github.ref_name }}"
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            Output/D2UberApp_Setup_v${{ env.APP_VERSION }}.exe
            D2UberApp_Windows_x64.zip
          body_path: release-notes-v${{ env.APP_VERSION }}.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
